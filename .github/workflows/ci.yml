name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: 3.12.15
      UV_MANAGED_PYTHON: "true"
    strategy:
      matrix:
        node-version: [22.23.4, 24.22.1, 26.12.1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python workspace
        working-directory: python
        run: uv sync --locked --all-packages --all-extras --group dev

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm nx run-many -t typecheck --all

      - name: Test
        run: pnpm nx run-many -t test --all

      - name: Python tests, types, and lint
        run: pnpm check:python

      - name: Installed Python wheels and MCP invocation
        run: pnpm check:python-wheels

      # The nx targets above do not run the repository-level fences, so run
      # them explicitly here. `pnpm test` chains check:store-imports, but CI
      # invokes nx directly and would otherwise skip all three.
      - name: Client-safe contracts fence
        run: pnpm check:client-safe

      - name: Store import fence
        run: pnpm check:store-imports

      - name: Public documentation check
        run: pnpm check:docs
