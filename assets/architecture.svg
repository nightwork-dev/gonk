<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="gonk core architecture: hosts sit on adapters and the extension-spec surface, which sit on the foundation packages auth, tool-registry, tool-orchestrator, scope, and store.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3bbb0"/>
    </marker>
    <style>
      .band   { fill:#a39a8e; font-size:11px; font-weight:600; letter-spacing:2px; }
      .pkg    { font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-size:13px; font-weight:600; fill:#8a2d3b; }
      .pkgn   { font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-size:13px; font-weight:600; fill:#3a342e; }
      .desc   { font-size:11.5px; fill:#8c8378; }
      .host   { font-size:13.5px; font-weight:600; fill:#3a342e; }
      .note   { font-size:12px; fill:#8c8378; font-style:italic; }
      .flow   { stroke:#c3bbb0; stroke-width:1.6; }
    </style>
  </defs>

  <rect x="8" y="8" width="864" height="344" rx="18" fill="#faf8f5" stroke="#e7e1d9"/>

  <!-- HOSTS -->
  <text class="band" x="32" y="40">HOSTS</text>
  <g>
    <rect x="32"  y="48" width="180" height="44" rx="10" fill="#ffffff" stroke="#dcd5cc"/>
    <rect x="244" y="48" width="180" height="44" rx="10" fill="#ffffff" stroke="#dcd5cc"/>
    <rect x="456" y="48" width="180" height="44" rx="10" fill="#ffffff" stroke="#dcd5cc"/>
    <rect x="668" y="48" width="180" height="44" rx="10" fill="#ffffff" stroke="#dcd5cc"/>
    <text class="host" x="122" y="75" text-anchor="middle">CLI</text>
    <text class="host" x="334" y="75" text-anchor="middle">MCP client</text>
    <text class="host" x="546" y="75" text-anchor="middle">Pi agent</text>
    <text class="host" x="758" y="75" text-anchor="middle">Claude Code</text>
  </g>

  <line class="flow" x1="200" y1="94" x2="200" y2="132" marker-end="url(#ah)"/>
  <line class="flow" x1="440" y1="94" x2="440" y2="132" marker-end="url(#ah)"/>
  <line class="flow" x1="680" y1="94" x2="680" y2="132" marker-end="url(#ah)"/>

  <!-- SURFACE -->
  <text class="band" x="32" y="128">SURFACE</text>
  <g>
    <rect x="32"  y="136" width="392" height="56" rx="10" fill="#ffffff" stroke="#dcd5cc"/>
    <rect x="456" y="136" width="392" height="56" rx="10" fill="#ffffff" stroke="#dcd5cc"/>
    <text class="pkg"  x="228" y="161" text-anchor="middle">@gonk/tool-registry-{cli,mcp,pi}</text>
    <text class="desc" x="228" y="180" text-anchor="middle">expose a registry to a host</text>
    <text class="pkg"  x="652" y="161" text-anchor="middle">@gonk/extension-spec  (+ -cli/-pi/-claude)</text>
    <text class="desc" x="652" y="180" text-anchor="middle">author once, materialize per host</text>
  </g>

  <line class="flow" x1="200" y1="194" x2="200" y2="232" marker-end="url(#ah)"/>
  <line class="flow" x1="440" y1="194" x2="440" y2="232" marker-end="url(#ah)"/>
  <line class="flow" x1="680" y1="194" x2="680" y2="232" marker-end="url(#ah)"/>

  <!-- FOUNDATION -->
  <text class="band" x="32" y="228">FOUNDATION</text>
  <g>
    <rect x="32"  y="236" width="150" height="56" rx="10" fill="#fbf3f3" stroke="#e3c9cd"/>
    <rect x="198" y="236" width="150" height="56" rx="10" fill="#fbf3f3" stroke="#e3c9cd"/>
    <rect x="364" y="236" width="150" height="56" rx="10" fill="#fbf3f3" stroke="#e3c9cd"/>
    <rect x="530" y="236" width="150" height="56" rx="10" fill="#fbf3f3" stroke="#e3c9cd"/>
    <rect x="696" y="236" width="150" height="56" rx="10" fill="#fbf3f3" stroke="#e3c9cd"/>
    <text class="pkg" style="font-size:10.5px" x="107" y="261" text-anchor="middle">@gonk/auth</text>
    <text class="desc" x="107" y="280" text-anchor="middle">identity + policy contracts</text>
    <text class="pkg" style="font-size:10.5px" x="273" y="261" text-anchor="middle">@gonk/tool-registry</text>
    <text class="desc" x="273" y="280" text-anchor="middle">typed secure dispatch</text>
    <text class="pkg" style="font-size:10.5px" x="439" y="261" text-anchor="middle">@gonk/tool-orchestrator</text>
    <text class="desc" x="439" y="280" text-anchor="middle">selection + ranking</text>
    <text class="pkg" style="font-size:10.5px" x="605" y="261" text-anchor="middle">@gonk/scope</text>
    <text class="desc" x="605" y="280" text-anchor="middle">five-tier resolution</text>
    <text class="pkg" style="font-size:10.5px" x="771" y="261" text-anchor="middle">@gonk/store</text>
    <text class="desc" x="771" y="280" text-anchor="middle">kv · blob · log · vector</text>
  </g>

  <!-- store & scope share one resolution -->
  <path d="M605,300 L605,312 L771,312 L771,300" fill="none" stroke="#cbb6ba" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="note" x="688" y="334" text-anchor="middle">store &amp; scope share one substrate</text>
</svg>
