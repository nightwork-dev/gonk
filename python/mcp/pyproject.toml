[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gonk-tool-registry-mcp"
version = "0.1.0"
description = "Official MCP stdio adapter for the native Python Gonk tool registry"
requires-python = ">=3.12"
dependencies = [
  "gonk-auth>=0.1.0,<0.2",
  "gonk-tool-registry>=0.1.0,<0.2",
  "mcp>=2.3.0,<3",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gonk contributors" }]
readme = "README.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pyright>=1.1",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gonk"]

[tool.hatch.build.targets.sdist]
include = ["src/gonk/mcp", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["../auth/src", "../tool-registry/src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N802", "N803", "N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
